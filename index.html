document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:hover{color:#6e2020}\n.navlink{cursor:pointer;font-family:Jost,sans-serif;font-weight:500;font-size:14px;color:#3a3a3a}\n.navlink:hover{color:#8c2a2a}\n.btn-solid{background:#8c2a2a;color:#fff;padding:12px 26px;border-radius:3px;font-family:Jost,sans-serif;font-weight:600;font-size:14px;cursor:pointer;border:1.5px solid #8c2a2a;display:inline-block}\n.btn-solid:hover{background:#6e2020;border-color:#6e2020}\n.btn-outline{border:1.5px solid #1a1a1a;color:#1a1a1a;padding:11px 24px;border-radius:3px;font-family:Jost,sans-serif;font-weight:600;font-size:14px;cursor:pointer;display:inline-block}\n.btn-outline:hover{background:#1a1a1a;color:#fff}\n.svc-row{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid #ece9e2}\ninput,textarea{font-family:Jost,sans-serif;font-size:14px;border:1.5px solid #ccc;border-radius:3px;padding:11px 13px;width:100%;box-sizing:border-box;color:#1a1a1a}\ninput:focus,textarea:focus{outline:none;border-color:#8c2a2a}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"display:flex;flex-direction:column;min-height:100vh\">\n\n  <div style=\"position:sticky;top:0;background:#fff;border-bottom:1px solid #ece9e2;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:16px 48px\">\n    <div sc-camel-on-click=\"{{ goHome }}\" style=\"display:flex;align-items:center;gap:3px;cursor:pointer;flex-shrink:0\">\n      <span style=\"font-family:Fraunces,serif;font-optical-sizing:none;font-variation-settings:'opsz' 144;font-weight:600;font-size:19px;color:#1a1a1a\">Partnership<\u002Fspan>\n      <span style=\"font-family:Fraunces,serif;font-optical-sizing:none;font-variation-settings:'opsz' 144;font-weight:600;font-style:italic;font-size:19px;color:#fff;background:#8c2a2a;padding:1px 7px;border-radius:2px\">Lab<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:32px\">\n      <span class=\"navlink\" sc-camel-on-click=\"{{ goServices }}\">Services<\u002Fspan>\n      <span class=\"navlink\" sc-camel-on-click=\"{{ goAbout }}\">About<\u002Fspan>\n      <span class=\"btn-solid\" sc-camel-on-click=\"{{ goContact }}\">Start a Conversation<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n    <div>\n      <div style=\"padding:88px 48px 72px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px;background:#faf9f6\">\n        <div style=\"font-family:Jost,sans-serif;font-weight:500;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#b08d3f\">Consulting for People-Centered Organizations<\u002Fdiv>\n        <div style=\"font-family:Fraunces,serif;font-optical-sizing:none;font-variation-settings:'opsz' 144;font-weight:600;font-size:44px;line-height:1.2;max-width:680px;color:#1a1a1a\">Learning &amp; development, done with academic rigor and operational know-how.<\u002Fdiv>\n        <div style=\"font-size:17px;color:#4a4a4a;max-width:540px;line-height:1.5\">From feedback-skills training to competency frameworks — for corporate teams and higher-ed programs alike.<\u002Fdiv>\n        <div style=\"display:flex;gap:14px;margin-top:8px\"><span class=\"btn-solid\" sc-camel-on-click=\"{{ goContact }}\">Start a Conversation<\u002Fspan><span class=\"btn-outline\" sc-camel-on-click=\"{{ goServices }}\">See Services<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"services-section\" style=\"padding:80px 48px;max-width:1040px;margin:0 auto\">\n        <div style=\"font-family:Fraunces,serif;font-optical-sizing:none;font-variation-settings:'opsz' 144;font-weight:600;font-size:28px;margin-bottom:6px\">Services<\u002Fdiv>\n        <div style=\"color:#666;font-size:14px;margin-bottom:32px\">A sample of work — every engagement is scoped to fit.<\u002Fdiv>\n        <div style=\"display:flex;gap:24px;flex-wrap:wrap\">\n          <div style=\"flex:1;min-width:260px;border:1px solid #e5e2d9;border-radius:3px;padding:26px;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font-family:Fraunces,serif;font-optical-sizing:none;font-variation-settings:'opsz' 144;font-weight:600;font-size:18px\">Training Design &amp; Revamp<\u002Fdiv>\n            <div style=\"font-size:13px;color:#555;line-height:1.5\">Feedback skills, manager onboarding, change management, succession planning &amp; more.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:260px;border:1px solid #e5e2d9;border-radius:3px;padding:26px;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font-family:Fraunces,serif;font-optical-sizing:none;font-variation-settings:'opsz' 144;font-weight:600;font-size:18px\">Strategic &amp; Advisory<\u002Fdiv>\n            <div style=\"font-size:13px;color:#555;line-height:1.5\">Research, competency frameworks, LMS strategy, and measurement &amp; evaluation design.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:260px;border:1px solid #e5e2d9;border-radius:3px;padding:26px;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font-family:Fraunces,serif;font-optical-sizing:none;font-variation-settings:'opsz' 144;font-weight:600;font-size:18px\">Custom Content Development<\u002Fdiv>\n            <div style=\"font-size:13px;color:#555;line-height:1.5\">Instructional design &amp; storyboarding for custom e-learning, at any scale.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:center;margin-top:32px\">\n          <span class=\"btn-outline\" sc-camel-on-click=\"{{ goContact }}\">Contact Us to Learn More<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:64px 48px;background:#1a1a1a;color:#fff\">\n        <div style=\"max-width:1040px;margin:0 auto;display:flex;gap:44px;align-items:center;flex-wrap:wrap\">\n          <img src=\"038ac974-5e2e-426d-856d-8f8925a9e9bb\" alt=\"Michelle V Hall\" style=\"width:180px;height:180px;border-radius:4px;object-fit:cover;flex-shrink:0\">\n          <div style=\"flex:1;min-width:280px\">\n            <div style=\"font-family:Fraunces,serif;font-optical-sizing:none;font-variation-settings:'opsz' 144;font-weight:600;font-size:24px\">Built on two decades of instructional design leadership.<\u002Fdiv>\n            <div style=\"color:#ccc;font-size:14px;margin-top:10px;line-height:1.5\">Led faculty development and AI policy at Columbia University — now applying that rigor to corporate L&amp;D and higher-ed programs alike.<\u002Fdiv>\n            <span class=\"btn-outline\" style=\"color:#fff;border-color:#fff;margin-top:16px\" sc-camel-on-click=\"{{ goAbout }}\">About Michelle →<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:72px 48px;text-align:center\">\n        <div style=\"font-family:Fraunces,serif;font-optical-sizing:none;font-variation-settings:'opsz' 144;font-weight:600;font-size:26px\">Tell me what's stuck.<\u002Fdiv>\n        <div style=\"color:#666;margin-top:6px\">Most engagements start with a 30-minute conversation.<\u002Fdiv>\n        <span class=\"btn-solid\" style=\"margin-top:16px\" sc-camel-on-click=\"{{ goContact }}\">Start a Conversation<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:72px 48px;max-width:900px;margin:0 auto;display:flex;gap:44px;align-items:flex-start;flex-wrap:wrap\">\n      <img src=\"038ac974-5e2e-426d-856d-8f8925a9e9bb\" alt=\"Michelle V Hall\" style=\"width:260px;height:310px;border-radius:4px;object-fit:cover;flex-shrink:0\">\n      <div style=\"flex:1;min-width:300px\">\n        <div style=\"font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#b08d3f\">About<\u002Fdiv>\n        <div style=\"font-family:Fraunces,serif;font-optical-sizing:none;font-variation-settings:'opsz' 144;font-weight:600;font-size:32px;margin-top:8px\">Michelle V Hall<\u002Fdiv>\n        <div style=\"color:#666;font-size:14px;margin-top:2px\">Founder, The Partnership Lab Consulting, LLC<\u002Fdiv>\n        <div style=\"margin-top:18px;font-size:15px;line-height:1.6;color:#333\">Two decades at Columbia University — instructional design, faculty development, and AI policy — now applied across corporate L&amp;D and higher-ed programs alike. I build the framework, run the program, and stay long enough to see it land.<\u002Fdiv>\n        <div style=\"margin-top:22px\">\n          <div style=\"font-family:Fraunces,serif;font-optical-sizing:none;font-variation-settings:'opsz' 144;font-weight:600;font-size:16px\">Expertise<\u002Fdiv>\n          <div style=\"font-size:13px;color:#555;margin-top:6px;line-height:1.6\">Instructional design · faculty development · AI adoption strategy · inclusive pedagogy · competency frameworks · learning measurement<\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"btn-solid\" style=\"margin-top:24px\" sc-camel-on-click=\"{{ goContact }}\">Start a Conversation<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isContact }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:72px 48px;max-width:520px;margin:0 auto;text-align:center\">\n      <div style=\"font-family:Fraunces,serif;font-optical-sizing:none;font-variation-settings:'opsz' 144;font-weight:600;font-size:30px\">Tell me what's stuck.<\u002Fdiv>\n      <div style=\"color:#666;margin-top:8px;font-size:15px\">Most engagements start with a 30-minute conversation — no pitch, just a chance to see if it's a fit.<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px;margin-top:32px;text-align:left\">\n        <div><label style=\"font-size:12px;color:#666\">Name<\u002Flabel><input type=\"text\" placeholder=\"Jordan Rivera\"><\u002Fdiv>\n        <div><label style=\"font-size:12px;color:#666\">Email<\u002Flabel><input type=\"email\" placeholder=\"jordan@company.com\"><\u002Fdiv>\n        <div><label style=\"font-size:12px;color:#666\">Organization type (optional)<\u002Flabel><input type=\"text\" placeholder=\"Corporate / Higher Ed / Nonprofit\"><\u002Fdiv>\n        <div><label style=\"font-size:12px;color:#666\">What's going on?<\u002Flabel><textarea rows=\"4\" placeholder=\"Tell me a bit about what you're working on.\"><\u002Ftextarea><\u002Fdiv>\n        <a href=\"mailto:michelle@partnership.consulting\" class=\"btn-solid\" style=\"text-align:center\">Send<\u002Fa>\n        <div style=\"text-align:center;font-size:12px;color:#999\">or email <a href=\"mailto:partnershiplabsuccess@gmail.com\">partnershiplabsuccess@gmail.com<\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isApproach }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:72px 48px;max-width:1040px;margin:0 auto\">\n      <div style=\"font-size:11px;color:#999;border:1px dashed #ccc;display:inline-block;padding:4px 10px;border-radius:3px;margin-bottom:16px\">Unlisted page — shared by direct link<\u002Fdiv>\n      <div style=\"font-family:Fraunces,serif;font-optical-sizing:none;font-variation-settings:'opsz' 144;font-weight:600;font-size:30px\">Approach &amp; Results<\u002Fdiv>\n      <div style=\"color:#666;margin-top:8px;font-size:15px;max-width:600px\">Rigorous instructional design methodology, applied to the realities of your organization.<\u002Fdiv>\n      <div style=\"display:flex;gap:16px;margin-top:32px;flex-wrap:wrap\">\n        <div style=\"flex:1;min-width:200px;border:1px solid #e5e2d9;padding:20px;text-align:center\"><div style=\"font-family:Fraunces,serif;font-weight:600;font-size:16px\">1. Discover<\u002Fdiv><div style=\"font-size:13px;color:#666;margin-top:6px\">Stakeholder interviews, needs assessment<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1;min-width:200px;border:1px solid #e5e2d9;padding:20px;text-align:center\"><div style=\"font-family:Fraunces,serif;font-weight:600;font-size:16px\">2. Design<\u002Fdiv><div style=\"font-size:13px;color:#666;margin-top:6px\">Curriculum, materials, framework<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1;min-width:200px;border:1px solid #e5e2d9;padding:20px;text-align:center\"><div style=\"font-family:Fraunces,serif;font-weight:600;font-size:16px\">3. Deliver<\u002Fdiv><div style=\"font-size:13px;color:#666;margin-top:6px\">Facilitator guide, workbook, slides<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1;min-width:200px;border:1px solid #e5e2d9;padding:20px;text-align:center\"><div style=\"font-family:Fraunces,serif;font-weight:600;font-size:16px\">4. Debrief<\u002Fdiv><div style=\"font-size:13px;color:#666;margin-top:6px\">One structured revision round<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:Fraunces,serif;font-optical-sizing:none;font-variation-settings:'opsz' 144;font-weight:600;font-size:22px;margin:44px 0 20px\">Results<\u002Fdiv>\n      <div style=\"display:flex;gap:18px;flex-wrap:wrap\">\n        <div style=\"flex:1;min-width:260px;border:1px solid #e5e2d9\"><div style=\"height:110px;background:#f4f2ec\"><\u002Fdiv><div style=\"padding:16px\"><div style=\"font-size:11px;color:#b08d3f;letter-spacing:1px;text-transform:uppercase\">Enterprise client<\u002Fdiv><div style=\"font-family:Fraunces,serif;font-weight:600;font-size:15px;margin-top:4px\">Change management rollout<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1;min-width:260px;border:1px solid #e5e2d9\"><div style=\"height:110px;background:#f4f2ec\"><\u002Fdiv><div style=\"padding:16px\"><div style=\"font-size:11px;color:#b08d3f;letter-spacing:1px;text-transform:uppercase\">University program<\u002Fdiv><div style=\"font-family:Fraunces,serif;font-weight:600;font-size:15px;margin-top:4px\">Faculty development redesign<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1;min-width:260px;border:1px solid #e5e2d9\"><div style=\"height:110px;background:#f4f2ec\"><\u002Fdiv><div style=\"padding:16px\"><div style=\"font-size:11px;color:#b08d3f;letter-spacing:1px;text-transform:uppercase\">Nonprofit / assoc.<\u002Fdiv><div style=\"font-family:Fraunces,serif;font-weight:600;font-size:15px;margin-top:4px\">New manager onboarding<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"margin-top:auto;padding:24px 48px;border-top:1px solid #ece9e2;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#888\">\n    <span>The Partnership Lab Consulting, LLC<\u002Fspan>\n    <span style=\"display:flex;gap:18px;align-items:center\"><span class=\"navlink\" sc-camel-on-click=\"{{ goServices }}\">Services<\u002Fspan><span class=\"navlink\" sc-camel-on-click=\"{{ goAbout }}\">About<\u002Fspan><span class=\"navlink\" sc-camel-on-click=\"{{ goContact }}\">Contact<\u002Fspan><span class=\"navlink\" style=\"color:#bbb\" sc-camel-on-click=\"{{ goApproach }}\">Approach &amp; Results ↗<\u002Fspan><\u002Fspan>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { page: 'home', pendingScroll: false };\n  goHome = () => this.setState({ page: 'home' });\n  goAbout = () => this.setState({ page: 'about' });\n  goContact = () => this.setState({ page: 'contact' });\n  goApproach = () => this.setState({ page: 'approach' });\n  goServices = () => {\n    if (this.state.page !== 'home') { this.setState({ page: 'home', pendingScroll: true }); }\n    else { this.scrollToServices(); }\n  };\n  scrollToServices() {\n    const el = document.getElementById('services-section');\n    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 76, behavior: 'smooth' });\n  }\n  componentDidUpdate(prevProps, prevState) {\n    if (this.state.pendingScroll) {\n      this.setState({ pendingScroll: false });\n      setTimeout(() => this.scrollToServices(), 60);\n    } else if (prevState.page !== this.state.page) {\n      window.scrollTo(0, 0);\n    }\n  }\n  renderVals() {\n    return {\n      isHome: this.state.page === 'home',\n      isAbout: this.state.page === 'about',\n      isContact: this.state.page === 'contact',\n      isApproach: this.state.page === 'approach',\n      goHome: this.goHome, goAbout: this.goAbout, goContact: this.goContact, goApproach: this.goApproach, goServices: this.goServices\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
